<header class="app-header">
  <h1 class="page-title">{{ title() }}</h1>

  <div class="user-dropdown dropdown">
    @if (menuOpen()) {
      <div class="dropdown-backdrop" (click)="menuOpen.set(false)"></div>
    }

    <button
      type="button"
      class="d-flex align-items-center gap-2 border-0 bg-transparent"
      (click)="menuOpen.set(!menuOpen())">
      <span class="user-avatar">{{ initials }}</span>
      <span class="d-none d-sm-block text-start">
        <span class="d-block fw-semibold">{{ auth.user()?.username }}</span>
        <span class="d-block small text-secondary">{{ auth.user()?.role }}</span>
      </span>
      <i class="bi bi-chevron-down small text-secondary"></i>
    </button>

    @if (menuOpen()) {
      <ul class="dropdown-menu dropdown-menu-end show">
        <li>
          <span class="dropdown-item-text small text-secondary">
            @if (auth.user()?.expiresAt) {
              Sesión hasta {{ auth.user()?.expiresAt | date: 'dd/MM/yyyy HH:mm' }}
            } @else {
              Sesión activa
            }
          </span>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <button type="button" class="dropdown-item text-danger" (click)="logout()">
            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
          </button>
        </li>
      </ul>
    }
  </div>
</header>
